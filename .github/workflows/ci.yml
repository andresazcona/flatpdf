name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  deploy:
    # Runs only when the repository defines the AWS_ROLE_ARN variable (an OIDC-assumable role, see infra/).
    needs: [test, docker, terraform]
    if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_api_key_sha256: ${{ secrets.API_KEY_SHA256 }}
      TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
      TF_VAR_certificate_arn: ${{ vars.CERTIFICATE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Init and create the ECR repositories first
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=flatpdf/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"
          terraform apply -auto-approve -target=aws_ecr_repository.api -target=aws_ecr_repository.worker
      - name: Build and push images
        run: |
          for target in api worker; do
            image="${{ steps.ecr.outputs.registry }}/flatpdf-${target}"
            docker build --target "${target}" --provenance=false -t "${image}:${GITHUB_SHA}" .
            docker push "${image}:${GITHUB_SHA}"
          done
      - name: Apply
        working-directory: infra
        run: terraform apply -auto-approve
